<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINE.B Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/admin.css"></head><body>
<section class="admin-login" id="adminLogin"><div class="admin-login-card"><img src="assets/logo.svg" alt="FINE.B"><span>PRODUCTION ADMIN</span><h1>관리자 로그인</h1><p>Firebase Authentication에 등록된 관리자 계정으로 로그인해주세요.</p><form id="adminLoginForm"><label>이메일<input id="adminEmail" type="email" autocomplete="username" required></label><label>비밀번호<input id="adminPassword" type="password" autocomplete="current-password" required></label><button type="submit">로그인</button><div class="admin-login-error" id="adminLoginError"></div></form><a href="index.html">← 사이트로 돌아가기</a></div></section>
<div class="admin-shell admin-hidden" id="adminApp"><aside class="admin-side"><a class="admin-brand" href="index.html"><img src="assets/logo.svg" alt="FINE.B"><p>PRODUCTION ADMIN</p></a><nav class="admin-nav"><button class="active" data-type="quote">견적문의</button><button data-type="sample">샘플문의</button><button data-type="inquiry">제작문의</button><a href="index.html" class="admin-site-link">사이트 보기 ↗</a></nav><div class="admin-meta">FINE.B Admin<br><span id="adminUserEmail">Firebase 연결</span></div></aside><main class="admin-main"><div class="admin-top"><div><small>FINE.B PRODUCTION ADMIN</small><h1>문의 관리</h1></div><div class="admin-actions"><button class="admin-btn" id="refreshAdmin">새로고침</button><button class="admin-btn" id="exportAdmin">JSON 내보내기</button><button class="admin-btn primary" id="logoutAdmin">로그아웃</button></div></div><section class="admin-stats"><article class="admin-stat"><span>전체 요청</span><strong id="statAll">0</strong></article><article class="admin-stat"><span>견적문의</span><strong id="statQuote">0</strong></article><article class="admin-stat"><span>샘플문의</span><strong id="statSample">0</strong></article><article class="admin-stat"><span>제작문의</span><strong id="statInquiry">0</strong></article><article class="admin-stat"><span>신규</span><strong id="statNew">0</strong></article></section><section class="admin-content"><div class="admin-list-wrap"><div class="admin-list-head"><h2 id="listTitle">견적문의</h2><div class="admin-filter"><button class="active" data-status="all">전체</button><button data-status="신규">신규</button><button data-status="확인중">확인중</button><button data-status="견적완료">견적완료</button><button data-status="완료">완료</button></div></div><div class="request-list" id="requestList"></div></div><aside class="admin-detail" id="requestDetail"><div class="detail-empty">왼쪽 요청을 선택하면<br>상세 내용이 표시됩니다.</div></aside></section><div class="admin-note" id="adminModeNote"><strong>Firebase 중앙관리 모드</strong> 견적·샘플·제작문의와 첨부파일을 관리자 계정으로 확인합니다.</div></main></div><script type="module" src="assets/js/admin.js"></script></body></html>
